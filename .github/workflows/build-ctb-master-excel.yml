name: Validate CTB Excel master

on:
  pull_request:
    branches: [main]
    paths:
      - docs/data/chimera_battle_ctb_redesign_v02_clean.xlsx
      - scripts/import_ctb_master.py
      - src/data/generated/**
      - package.json
      - .github/workflows/build-ctb-master-excel.yml
  push:
    branches: [main]
    paths:
      - docs/data/chimera_battle_ctb_redesign_v02_clean.xlsx
      - scripts/import_ctb_master.py
      - src/data/generated/**
      - package.json
      - .github/workflows/build-ctb-master-excel.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate XLSX and generated runtime master data
        run: python scripts/import_ctb_master.py --check
      - name: Show generated-data manifest
        run: cat src/data/generated/manifest.json
