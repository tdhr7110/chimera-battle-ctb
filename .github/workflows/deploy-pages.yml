name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - integration/main-game
      - claude/chimera-7slot-prototype-dbqssf
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ルート配信は常にmainの内容にする(integration/main-gameやプロトタイプ用ブランチへの
      # pushがトリガーになった場合でも、本番URL直下の内容が入れ替わらないようにするため)。
      - name: Checkout (main = ルート配信)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 統合作業版(Phase 1a〜)を /dev/ サブパスへ同梱する。main(検証済みCTB単発デモ)の
      # ルート配信は変更せず、統合ブランチだけ別URLで確認できるようにする(仕様書0章の
      # 「既存環境へ直接上書きしない」を満たすため、本番URLの内容は主ブランチのものを維持する)。
      - name: Checkout integration branch (統合作業版)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: integration/main-game
          path: integration-branch

      - name: Build integration branch into /dev/ subpath
        if: hashFiles('integration-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd integration-branch
          npm ci
          npm run build -- --base=/chimera-battle-ctb/dev/
          mkdir -p ../dist/dev
          cp -r dist/. ../dist/dev/

      # 7スロット・キメラ画像合成プロトタイプ(検証専用、本番のゲーム進行・データには無関係)を
      # /proto-chimera/ サブパスへ同梱する。上記2つと同じ考え方で、mainのルート配信は変更しない。
      - name: Checkout prototype branch (7スロット・キメラ画像合成プロトタイプ)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/chimera-7slot-prototype-dbqssf
          path: proto-chimera-branch

      - name: Build prototype branch into /proto-chimera/ subpath
        if: hashFiles('proto-chimera-branch/package.json') != ''
        continue-on-error: true
        run: |
          cd proto-chimera-branch
          npm ci
          npm run build -- --base=/chimera-battle-ctb/proto-chimera/
          mkdir -p ../dist/proto-chimera
          cp -r dist/. ../dist/proto-chimera/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
